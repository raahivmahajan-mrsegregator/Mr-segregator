<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Segregator — Register Now</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg-dark: #0b0f1a; 
      --bg-mid: #141a2f; 
      --accent: #00ffd0; 
    }

    * {
      box-sizing: border-box;
    }

    body { 
      font-family: 'Poppins', sans-serif; 
      background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid)); 
      color: #fff; 
      min-height: 100dvh; 
      margin: 0;
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px;
    }

    .card { 
      background: var(--bg-mid); 
      padding: 3rem 2rem; 
      border-radius: 24px; 
      max-width: 460px; 
      width: 100%;
      text-align: center; 
      border: 1px solid rgba(0,255,208,0.3); 
    }

    h1, h2, p {
      margin: 0 auto;
      max-width: 90%;
    }

    input { 
      display: block;
      width: 100%;
      max-width: 360px;           /* ← prevents ultra-wide inputs on big screens */
      margin: 16px auto;          /* ← centers + nice spacing */
      padding: 16px;
      background: rgba(255,255,255,0.1); 
      border: 1px solid var(--accent); 
      border-radius: 12px; 
      color: white; 
      font-size: 1.1rem;
      font-family: inherit;
    }

    input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    button { 
      background: var(--accent); 
      color: #0b0f1a; 
      padding: 18px; 
      border: none; 
      border-radius: 50px; 
      font-weight: 700; 
      width: 100%;
      max-width: 360px;           /* ← matches input width for harmony */
      margin: 20px auto 8px;
      font-size: 1.3rem; 
      cursor: pointer;
      font-family: inherit;
    }

    /* SUCCESS SCREEN */
    #success-screen { display: none; }
    #success-id { 
      font-size: 2.2rem; 
      color: var(--accent); 
      font-weight: 700; 
      margin: 25px 0 15px; 
    }

    .success-links a {
      display: block;
      background: rgba(255,255,255,0.1);
      color: var(--accent);
      padding: 16px;
      margin: 12px auto;
      max-width: 360px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <!-- FORM SCREEN -->
    <div id="form-screen">
      <h1>🌟 SUPER SEGREGATOR REGISTRATION</h1>
      <p style="margin: 20px auto; opacity: 0.9; max-width: 90%;">
        Enter your details and get your unique ID instantly!
      </p>
      
      <input type="text" id="name" placeholder="Full Name *">
      <input type="text" id="age"  placeholder="Age *">
      <input type="text" id="city" placeholder="City *">
      
      <button onclick="registerKid()">REGISTER & GET MY ID</button>
    </div>

    <!-- SUCCESS SCREEN -->
    <div id="success-screen">
      <h2>🎉 REGISTRATION SUCCESSFUL!</h2>
      <div id="success-id">Your unique ID is being generated...</div>
      <p style="opacity: 0.9; max-width: 90%; margin: 0 auto 25px;">
        It will appear on the leaderboard shortly as SEG-XXX
      </p>
      
      <div class="success-links">
        <a href="leaderboard.html">View Leaderboard →</a>
        <a href="SampleEntry.html">View Sample Entry →</a>
      </div>
    </div>
  </div>

  <script>
    const FORM_ID = '1FAIpQLSdxqxJrdi-Mrp6XBpmmPCxXUMQ_B8zrGzneXRIWjpzmjtUgSg';

    function registerKid() {
      const name = document.getElementById('name').value.trim();
      const age  = document.getElementById('age').value.trim();
      const city = document.getElementById('city').value.trim();

      if (!name || !age || !city) {
        alert("Please fill all fields");
        return;
      }

      const formUrl = `https://docs.google.com/forms/u/0/d/e/${FORM_ID}/formResponse`;
      const data = new URLSearchParams();
      data.append('entry.137495369', name);
      data.append('entry.1289596246', age);
      data.append('entry.924456839', city);

      fetch(formUrl, { method: 'POST', body: data, mode: 'no-cors' })
        .then(() => {
          document.getElementById('form-screen').style.display = 'none';
          document.getElementById('success-screen').style.display = 'block';
        });
    }
  </script>
</body>
</html>
