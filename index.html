<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mr. Segregator — Circular System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================
   VARIABLES
========================= */
:root {
  --bg-dark: #0b0f1a;
  --bg-mid: #141a2f;
  --accent: #00ffd0;
  --accent-soft: rgba(0,255,208,0.35);
  --border: rgba(255,255,255,0.18);
  --text: #f4f6ff;
  --muted: #aab0d4;
  --glow-green: #00ff9d; /* For recycle symbol glow */

  /* New hue colors – increased opacity for vibrancy */
  --hue-wet: rgba(0, 255, 128, 0.5);      /* Vibrant green for wet */
  --hue-dry: rgba(0, 128, 255, 0.5);      /* Vibrant blue for dry */
  --hue-sanitary: rgba(255, 105, 180, 0.5); /* Vibrant pink for sanitary */
  --hue-special: rgba(255, 0, 0, 0.5);     /* Vibrant red for special */
}

/* =========================
   RESET & BODY
========================= */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', system-ui, sans-serif;
  background: radial-gradient(800px 400px at top, #1a2142, transparent),
              linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
  color: var(--text);
  min-height: 100vh;
}

/* =========================
   HEADER & SECTION
========================= */
header {
  padding: 14px 18px;
  font-weight: 700;
  letter-spacing: 1px;
}

.categories-section {
  padding: 20px 16px 64px;
  text-align: center;
}

.categories-title {
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 10px;
  background: linear-gradient(90deg, #00ffd0, #6ddcff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subcategory-section {
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 20px;
}

/* =========================
   CIRCULAR SYSTEM
========================= */
.circular-wrapper {
  position: relative;
  width: 340px;
  height: 340px;
  margin: 56px auto 0;

  /* Uniform orbital variables */
  --orbit-size: 86px;
  --offset: 28px;
}

/* Guide ring */
.circular-wrapper::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px dashed rgba(255,255,255,0.15);
  opacity: 0.4;
}

/* CENTER CIRCLE — BLENDED & GLOWY (NO WHITE BG) */
.center-circle {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 130px; /* Smaller now */
  height: 130px;
  border-radius: 50%;
  background: transparent; /* Blends into dark background */
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;

  /* Outer glow for the area */
  box-shadow: 0 0 32px var(--accent-soft);

  animation: center-breathe 6s ease-in-out infinite;

  /* Force sharper rendering */
  transform: translateZ(0);
  backface-visibility: hidden;
}

.recycle-symbol {
  font-size: 7rem; /* Adjusted for smaller circle */
  color: var(--glow-green); /* Brighter green for eco theme */
  line-height: 1;
  transform: rotate(-15deg); /* Slight rotation for dynamic look */

  /* Glowy effect on the symbol itself */
  text-shadow: 
    0 0 8px var(--glow-green),
    0 0 16px var(--accent-soft),
    0 0 24px var(--accent-soft);

  animation: symbol-glow 4s ease-in-out infinite alternate; /* Pulsing glow */
}

/* Orbit Ring (rotates) */
.orbit-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  animation: orbit-rotate 40s linear infinite;
}

/* Individual Orbit Nodes */
.orbit {
  position: absolute;
  text-decoration: none;
  color: inherit;
  width: var(--orbit-size);
  height: var(--orbit-size);
  border-radius: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.03));
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  animation: orbit-counter 40s linear infinite;
  cursor: pointer; /* Hand cursor for all clickable orbits */
  transition: box-shadow 0.3s ease; /* Smooth hover */
}

.orbit:hover {
  box-shadow: 0 0 20px var(--accent-soft); /* Glow on hover */
}

.orbit span { font-size: 1.7rem; }
.orbit p {
  font-size: 0.6rem;
  letter-spacing: 0.6px;
  color: var(--muted);
}

/* Add color hues via inset shadow – increased blur for vibrancy */
.orbit.wet {
  box-shadow: inset 0 0 28px var(--hue-wet);
}

.orbit.dry {
  box-shadow: inset 0 0 28px var(--hue-dry);
}

.orbit.sanitary {
  box-shadow: inset 0 0 28px var(--hue-sanitary);
}

.orbit.special {
  box-shadow: inset 0 0 28px var(--hue-special);
}

/* ========================
   POSITIONING (UNIFORM & RESPONSIVE)
======================== */
.wet     { top: calc(-1 * var(--offset)); left: calc(50% - (var(--orbit-size) / 2)); }
.dry     { right: calc(-1 * var(--offset)); top: calc(50% - (var(--orbit-size) / 2)); }
.sanitary{ bottom: calc(-1 * var(--offset)); left: calc(50% - (var(--orbit-size) / 2)); }
.special { left: calc(-1 * var(--offset)); top: calc(50% - (var(--orbit-size) / 2)); }

/* =========================
   ANIMATIONS
========================= */
@keyframes orbit-rotate {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

@keyframes orbit-counter {
  from { transform: rotate(0deg); }
  to   { transform: rotate(-360deg); }
}

@keyframes center-breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

@keyframes symbol-glow {
  0% { text-shadow: 0 0 8px var(--glow-green), 0 0 16px var(--accent-soft), 0 0 24px var(--accent-soft); }
  100% { text-shadow: 0 0 12px var(--glow-green), 0 0 24px var(--accent-soft), 0 0 36px var(--accent-soft); }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  .orbit-ring, .orbit { animation: none; }
}

/* =========================
   TABLET
========================= */
@media (min-width: 768px) {
  .circular-wrapper {
    width: 440px;
    height: 440px;
    --orbit-size: 120px;
    --offset: 41px;
  }
  .center-circle {
    width: 180px; /* Smaller */
    height: 180px;
  }
  .recycle-symbol {
    font-size: 9.5rem; /* Adjusted */
  }
  .orbit { width: 120px; height: 120px; }
  .orbit span { font-size: 2.4rem; }
  .orbit p { font-size: 0.8rem; }
}

/* =========================
   DESKTOP
========================= */
@media (min-width: 1024px) {
  .circular-wrapper {
    width: 520px;
    height: 520px;
    --orbit-size: 140px;
    --offset: 47px;
  }
  .center-circle {
    width: 220px; /* Smaller */
    height: 220px;
  }
  .recycle-symbol {
    font-size: 11.5rem; /* Adjusted */
  }
  .orbit { width: 140px; height: 140px; }
}
</style>
</head>

<body>

<header>MR.SEGREGATOR</header>

<section class="categories-section">
  <h2 class="categories-title">Segregate</h2>
  <h5 class="subcategory-section">Get to ZERO Waste!!</h5>

  <div class="circular-wrapper">
    <div class="center-circle">
      <span class="recycle-symbol">♻️</span>
    </div>

    <div class="orbit-ring">
      <a class="orbit wet" href="wet.html"><span>🌿</span><p>WET</p></a>
      <a class="orbit dry" href="dry.html"><span>📦</span><p>DRY</p></a>
      <a class="orbit sanitary" href="sanitary.html"><span>🩹</span><p>SANITARY</p></a>
      <a class="orbit special" href="special.html"><span>⚠️</span><p>SPECIAL</p></a>
    </div>
  </div>
</section>

</body>
</html>
