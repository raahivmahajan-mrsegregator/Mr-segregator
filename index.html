<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mr. Segregator — Circular System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================
   VARIABLES
========================= */
:root {
  --bg-dark: #0b0f1a;
  --bg-mid: #141a2f;
  --accent: #00ffd0;
  --accent-soft: rgba(0,255,208,0.35);
  --border: rgba(255,255,255,0.18);
  --text: #f4f6ff;
  --muted: #aab0d4;
}

/* =========================
   RESET & BODY
========================= */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', system-ui, sans-serif;
  background: radial-gradient(800px 400px at top, #1a2142, transparent),
              linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
  color: var(--text);
  min-height: 100vh;
}

/* =========================
   HEADER & SECTION
========================= */
header {
  padding: 14px 18px;
  font-weight: 700;
  letter-spacing: 1px;
}

.categories-section {
  padding: 20px 16px 64px;
  text-align: center;
}

.categories-title {
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 10px;
  background: linear-gradient(90deg, #00ffd0, #6ddcff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subcategory-section {
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 20px;
}

/* =========================
   CIRCULAR SYSTEM
========================= */
.circular-wrapper {
  position: relative;
  width: 340px;
  height: 340px;
  margin: 56px auto 0;

  /* Uniform orbital variables */
  --orbit-size: 86px;
  --offset: 28px;
}

/* Guide ring */
.circular-wrapper::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px dashed rgba(255,255,255,0.15);
  opacity: 0.4;
}

/* CENTER CIRCLE — SHARPENED WITHOUT BORDER */
.center-circle {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: #ffffff;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;

  /* Reduced & optimized shadows for sharper edges */
  box-shadow:
    0 0 24px var(--accent-soft),           /* softer outer glow, less blur */
    inset 0 0 6px rgba(255,255,255,0.35);  /* very subtle inset – removes most edge softening */

  animation: center-breathe 6s ease-in-out infinite;

  /* Force sharper rendering */
  transform: translateZ(0);
  backface-visibility: hidden;
}

.center-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;

  /* Sharpen logo rendering */
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
  filter: contrast(1.08) saturate(1.12) brightness(1.02);
}

/* Orbit Ring (rotates) */
.orbit-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  animation: orbit-rotate 40s linear infinite;
}

/* Individual Orbit Nodes */
.orbit {
  position: absolute;
  text-decoration: none;
  color: inherit;
  width: var(--orbit-size);
  height: var(--orbit-size);
  border-radius: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.03));
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  animation: orbit-counter 40s linear infinite;
}

.orbit span { font-size: 1.7rem; }
.orbit p {
  font-size: 0.6rem;
  letter-spacing: 0.6px;
  color: var(--muted);
}

/* ========================
   POSITIONING (UNIFORM & RESPONSIVE)
======================== */
.wet     { top: calc(-1 * var(--offset)); left: calc(50% - (var(--orbit-size) / 2)); }
.dry     { right: calc(-1 * var(--offset)); top: calc(50% - (var(--orbit-size) / 2)); }
.sanitary{ bottom: calc(-1 * var(--offset)); left: calc(50% - (var(--orbit-size) / 2)); }
.special { left: calc(-1 * var(--offset)); top: calc(50% - (var(--orbit-size) / 2)); }

/* =========================
   ANIMATIONS
========================= */
@keyframes orbit-rotate {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

@keyframes orbit-counter {
  from { transform: rotate(0deg); }
  to   { transform: rotate(-360deg); }
}

@keyframes center-breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  .orbit-ring, .orbit { animation: none; }
}

/* =========================
   TABLET
========================= */
@media (min-width: 768px) {
  .circular-wrapper {
    width: 440px;
    height: 440px;
    --orbit-size: 120px;
    --offset: 41px;
  }
  .center-circle {
    width: 210px;
    height: 210px;
  }
  .orbit { width: 120px; height: 120px; }
  .orbit span { font-size: 2.4rem; }
  .orbit p { font-size: 0.8rem; }
}

/* =========================
   DESKTOP
========================= */
@media (min-width: 1024px) {
  .circular-wrapper {
    width: 520px;
    height: 520px;
    --orbit-size: 140px;
    --offset: 47px;
  }
  .center-circle {
    width: 260px;
    height: 260px;
  }
  .orbit { width: 140px; height: 140px; }
}
</style>
</head>

<body>

<header>MR.SEGREGATOR</header>

<section class="categories-section">
  <h2 class="categories-title">Segregate</h2>
  <h5 class="subcategory-section">Get to ZERO Waste!!</h5>

  <div class="circular-wrapper">
    <div class="center-circle">
      <img src="centImg.png" alt="Mr Segregator">
    </div>

    <div class="orbit-ring">
      <a class="orbit wet" href="wet.html"><span>🌿</span><p>WET</p></a>
      <div class="orbit dry"><span>📦</span><p>DRY</p></div>
      <div class="orbit sanitary"><span>🩹</span><p>SANITARY</p></div>
      <div class="orbit special"><span>⚠️</span><p>SPECIAL</p></div>
    </div>
  </div>
</section>

</body>
</html>
