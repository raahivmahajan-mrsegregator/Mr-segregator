<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mr. Segregator — Flat Infographic</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================
   VARIABLES
========================= */
:root {
  --bg-dark: #0b0f1a;
  --bg-mid: #141a2f;
  --accent: #00ffd0;
  --accent-soft: rgba(0,255,208,0.35);
  --border: rgba(255,255,255,0.12); /* More transparent border */
  --text: #f4f6ff;
  --muted: #aab0d4;
  --glow-green: #00ff9d; /* For recycle symbol glow */

  /* Adjusted hue colors to match darker tones in the reference image */
  --hue-wet: rgba(0, 100, 50, 0.85);        /* Darker green for wet */
  --hue-dry: rgba(0, 50, 150, 0.85);        /* Darker blue for dry */
  --hue-sanitary: rgba(150, 0, 100, 0.85);  /* Darker magenta/purple for sanitary */
  --hue-special: rgba(150, 0, 0, 0.85);     /* Darker red for special */
  --hue-ewaste: rgba(200, 100, 0, 0.85);    /* Orange for e-waste */
  --hue-cnd: rgba(100, 50, 0, 0.85);        /* Brown for C&D waste */
  --hue-resin: rgba(100, 0, 150, 0.85);     /* Purple for resin codes */
  --hue-how: rgba(0, 100, 200, 0.85);       /* Blue for how to segregate */
}

/* =========================
   RESET & BODY
========================= */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', system-ui, sans-serif;
  background: radial-gradient(800px 400px at top, #1a2142, transparent),
              linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* =========================
   HEADER
========================= */
header {
  padding: 14px 18px;
  font-weight: 700;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.header-logo {
  font-size: 1.3rem;
  color: var(--accent);
  text-decoration: none;
}

.categories-section {
  padding: 20px 16px 64px;
  text-align: center;
  flex-grow: 1; /* Improved layout for modern UX */
}

/* Modern title styling */
.categories-title {
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 10px;
  background: linear-gradient(90deg, #00ffd0, #6ddcff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2); /* Subtle shadow for depth */
}

.subcategory-section {
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 20px;
}

/* =========================
   FLAT INFOGRAPHIC TILES
========================= */
.tiles-wrapper {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px; /* Increased gap to prevent overlap/cutting on hover */
  max-width: 800px;
  margin: 56px auto 0;
  overflow-x: auto; /* Allow scrolling on small screens */
  padding: 0 16px; /* Added padding for better mobile UX */
  scrollbar-width: thin; /* Modern scrollbar */
  scrollbar-color: var(--accent-soft) transparent;
}

/* Individual Tiles - Enhanced Modern Glass Effect with More Transparency */
.tile {
  text-decoration: none;
  color: inherit;
  width: 120px;
  height: 120px;
  border-radius: 20px; /* More rounded for modern feel */
  background: rgba(255, 255, 255, 0.03); /* Increased transparency */
  backdrop-filter: blur(16px); /* Stronger blur for premium glass effect */
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  transition: box-shadow 0.4s ease, background 0.4s ease; /* Removed transform to avoid layout issues */
  position: relative;
  flex-shrink: 0; /* Prevent shrinking */
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); /* Lighter always-on shadow */
  /* Removed overflow: hidden to prevent content cutting on scale */
}

.tile:hover {
  box-shadow: 0 0 20px var(--hue-color); /* Alternative: Colored glow shadow on hover */
  background: rgba(255, 255, 255, 0.05); /* Slight background change on hover */
  z-index: 10; /* Bring to front to prevent cutting */
}

.tile span { 
  font-size: 2.5rem; 
  transition: transform 0.4s ease, filter 0.4s ease; /* Alternative: Blur and rotate for dynamic effect */
}

.tile:hover span {
  transform: rotate(10deg); /* Slight rotation for alternative animation */
  filter: brightness(1.2); /* Brighten icon on hover */
}

.tile p {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.6px;
  color: var(--accent); /* Changed to cyan for matching reference image */
  text-transform: uppercase;
  transition: text-shadow 0.4s ease; /* Simplified transition */
}

.tile:hover p {
  text-shadow: 0 0 12px var(--accent); /* Stronger glow on text */
}

/* Color overlays - increased transparency */
.tile::before {
  content: '';
  position: absolute;
  inset: 0;
  background-color: var(--hue-color);
  opacity: 0.3; /* More transparent tint */
  border-radius: 20px;
  transition: opacity 0.4s ease;
}

.tile:hover::before {
  opacity: 0.6; /* Stronger tint on hover for alternative effect */
}

.tile.wet { --hue-color: var(--hue-wet); }
.tile.dry { --hue-color: var(--hue-dry); }
.tile.sanitary { --hue-color: var(--hue-sanitary); }
.tile.special { --hue-color: var(--hue-special); }
.tile.ewaste { --hue-color: var(--hue-ewaste); }
.tile.cnd { --hue-color: var(--hue-cnd); }
.tile.resin { --hue-color: var(--hue-resin); }
.tile.how { --hue-color: var(--hue-how); }

/* Updated icons to better match the reference image */
.tile.wet span { content: '🌱'; } /* Leaf for wet */
.tile.dry span { content: '📦'; } /* Box for dry */
.tile.sanitary span { content: '💊'; } /* Pill for sanitary */
.tile.special span { content: '⚠️'; } /* Warning for special */

/* =========================
   RESPONSIVE IMPROVEMENTS
========================= */
/* Mobile: Smaller tiles for better fit, allow wrap if needed */
@media (max-width: 480px) {
  .tiles-wrapper {
    flex-wrap: wrap;
    gap: 12px;
    justify-content: space-around;
    overflow-x: visible;
  }
  .tile {
    width: 100px;
    height: 100px;
  }
  .tile span { font-size: 2rem; }
  .tile p { font-size: 0.65rem; }
}

/* Tablet */
@media (min-width: 768px) {
  .tiles-wrapper {
    gap: 24px;
    flex-wrap: wrap; /* Revert to wrap for multiple rows */
  }
  .tile {
    width: 140px;
    height: 140px;
  }
  .tile span { font-size: 3rem; }
  .tile p { font-size: 0.85rem; }
}

/* Desktop */
@media (min-width: 1024px) {
  .tiles-wrapper {
    gap: 28px;
  }
  .tile {
    width: 160px;
    height: 160px;
  }
  .tile span { font-size: 3.5rem; }
  .tile p { font-size: 0.95rem; }
}

/* =========================
   FOOTER
========================= */
footer {
  padding: 40px 16px;
  text-align: center;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.85rem;
  margin-top: auto; /* Push footer to bottom */
}

.footer-links {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 16px;
}

.footer-links a {
  color: var(--muted);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.3s;
}

.footer-links a:hover {
  color: var(--accent);
}
</style>
</head>

<body>
<header>
  <a href="index.html" class="header-logo">MR.SEGREGATOR</a>
</header>
<section class="categories-section">
  <h2 class="categories-title">Segregate</h2>
  <h5 class="subcategory-section">Get to ZERO Waste!!</h5>

  <div class="tiles-wrapper">
    <a class="tile wet" href="wet.html"><span>🌱</span><p>WET/ORGANIC</p></a>
    <a class="tile dry" href="dry.html"><span>📦</span><p>DRY/RECYCLABLE</p></a>
    <a class="tile sanitary" href="sanitary.html"><span>🩸🧼</span><p>SANITARY</p></a>
    <a class="tile special" href="special.html"><span>⚠️💊</span><p>SPECIAL</p></a>
    <a class="tile ewaste" href="e-waste.html"><span>📱</span><p>E-WASTE</p></a>
    <a class="tile cnd" href="cnd-waste.html"><span>🏗️</span><p>C & D WASTE</p></a>
    <a class="tile resin" href="resin-codes.html"><span>♺ 7</span><p>RESIN CODES</p></a>
    <a class="tile how" href="how-to-segregate.html"><span>❓</span><p>HOW DO I SEGREGATE?</p></a>
  </div>
</section>

<footer>
  <p>Mr. Segregator © 2026 • Segregate Today, Sustain Tomorrow</p>
</footer>

</body>
</html>
