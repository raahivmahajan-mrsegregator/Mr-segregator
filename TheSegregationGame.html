<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mr. Segregator — Waste Sorting Game</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================
   VARIABLES (same as main pages)
========================= */
:root {
  --bg-dark: #0b0f1a;
  --bg-mid: #141a2f;
  --accent: #00ffd0;
  --accent-soft: rgba(0,255,208,0.35);
  --border: rgba(255,255,255,0.18);
  --text: #f4f6ff;
  --muted: #aab0d4;
  --success: #00ff9d; /* Optional success color, can adjust */
}

/* =========================
   RESET & BODY
========================= */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', system-ui, sans-serif;
  background: radial-gradient(800px 400px at top, #1a2142, transparent),
              linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* =========================
   HEADER
========================= */
header {
  padding: 14px 18px;
  font-weight: 700;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.header-logo {
  font-size: 1.3rem;
  color: var(--accent);
  text-decoration: none;
}

.back-btn {
  font-size: 0.95rem;
  color: var(--muted);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color 0.3s;
}

.back-btn:hover {
  color: var(--accent);
}

/* =========================
   HERO / MAIN SECTION
========================= */
.hero {
  padding: 28px 16px 20px; /* Reduced bottom padding */
  text-align: center;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  top: -100px;
  left: 50%;
  transform: translateX(-50%);
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
  border-radius: 50%;
  opacity: 0.6;
  z-index: 0;
}

.hero-content {
  position: relative;
  z-index: 1;
}

.hero-title {
  font-size: 2.2rem; /* Reduced size */
  font-weight: 700;
  margin-bottom: 2px;
  background: linear-gradient(90deg, #00ffd0, #6ddcff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* =========================
   GAME SECTION (IFRAME PLACEHOLDER)
========================= */
.game-section {
  padding: 0 16px 80px; /* Reduced top padding */
  max-width: 800px;
  margin: 0 auto;
  position: relative;
}

.game-iframe {
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  box-shadow: 0 0 24px var(--accent-soft);
  border: 1px solid var(--border);
  width: 100%;
  max-width: 320px;
  height: 520px;
  margin: 0 auto;
  display: block;
  /* Extra insurance against scrollbars */
  scrollbar-width: none; /* Firefox */
}

.game-iframe::-webkit-scrollbar {
  display: none; /* Chrome/Safari/Edge */
}

/* =========================
   FOOTER
========================= */
footer {
  padding: 40px 16px;
  text-align: center;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.85rem;
}

/* =========================
   RESPONSIVE
========================= */
@media (min-width: 768px) {
  .hero { padding: 40px 16px 20px; } /* Reduced bottom padding */
  .hero-title { font-size: 2.8rem; } /* Reduced size */
  
  .game-section { padding: 0 24px 100px; } /* Reduced top padding */
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="header-logo">MR.SEGREGATOR</a>
  <a href="index.html" class="back-btn">⬅️ Back</a>
</header>

<section class="hero">
  <div class="hero-content">
    <h1 class="hero-title">Waste Sorting Game</h1>
  </div>
</section>

<div class="game-section">
  <!-- IFRAME PLACEHOLDER: Replace src with your game URL or embed code -->
  <iframe class="game-iframe" src="SegregationGame.html" frameborder="0" allowfullscreen scrolling="no">
  </iframe>
</div>

<footer>
  <p>Mr. Segregator © 2026 • Segregate Today, Sustain Tomorrow</p>
</footer>

</body>
</html>
