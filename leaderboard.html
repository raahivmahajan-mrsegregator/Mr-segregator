<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Super Segregator Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
:root {
  --bg-dark: #0b0f1a;
  --bg-mid: #141a2f;
  --accent: #00ffd0;
  --accent-soft: rgba(0,255,208,0.35);
  --border: rgba(255,255,255,0.18);
  --text: #f4f6ff;
  --muted: #aab0d4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(800px 400px at top, #1a2142, transparent),
              linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
  color: var(--text);
  min-height: 100vh;
  text-align: center;
}

header { padding: 20px; border-bottom: 1px solid var(--border); }
.header-logo { font-size: 1.4rem; color: var(--accent); text-decoration: none; }

h1 {
  font-size: 2.8rem;
  font-weight: 700;
  background: linear-gradient(90deg, #00ffd0, #6ddcff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 30px 0 10px;
}

/* LIVE + SOUND CONTROLS */
.controls {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}
.live-badge, .sound-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(0,255,208,0.15);
  color: var(--accent);
  font-size: 0.95rem;
  font-weight: 600;
  padding: 6px 16px;
  border-radius: 50px;
  border: 1px solid var(--accent-soft);
  cursor: pointer;
  transition: all 0.3s;
}
.live-badge::before { content: "●"; color: #00ff9d; animation: live-blink 1.5s infinite; }
.sound-toggle:hover { background: rgba(0,255,208,0.25); transform: scale(1.05); }
@keyframes live-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* RANK ANIMATION */
.rank-up {
  animation: rankPop 2.2s ease-out forwards;
  position: relative;
}
.rank-up::after {
  content: '↑';
  position: absolute;
  left: -32px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.4rem;
  color: #ff00aa;
  text-shadow: 0 0 15px #ff00aa;
  animation: arrowPop 1.8s ease-out;
}
@keyframes rankPop {
  0%   { box-shadow: 0 0 0 rgba(0,255,208,0); transform: scale(1.04); }
  15%  { box-shadow: 0 0 80px #00ffd0, 0 0 120px #ff00aa; transform: scale(1.08); }
  50%  { box-shadow: 0 0 50px #00ffd0; }
  100% { box-shadow: 0 0 0 rgba(0,255,208,0); transform: scale(1); }
}
@keyframes arrowPop {
  0%   { opacity: 0; transform: translateY(-50%) scale(0.5); }
  30%  { opacity: 1; transform: translateY(-50%) scale(1.3); }
  100% { opacity: 1; transform: translateY(-50%) scale(1); }
}

#toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,255,208,0.95);
  color: #000;
  font-weight: 700;
  padding: 12px 24px;
  border-radius: 50px;
  box-shadow: 0 0 30px var(--accent);
  display: none;
  z-index: 9999;
  animation: toast-pop 0.4s;
}
@keyframes toast-pop { from { opacity:0; transform: translate(-50%,20px); } to { opacity:1; transform: translate(-50%,0); } }

#loading-text {
  color: var(--accent);
  font-size: 1.2rem;
  margin: 40px 0;
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100% {opacity:0.6;} 50%{opacity:1;} }

#leaderboard-container { 
  max-width: 980px; 
  margin: 20px auto; 
  padding: 0 20px; 
  display:none; 
}

table {
  width: 100%; 
  border-collapse: collapse;
  background: rgba(255,255,255,0.03);
  border: 2px solid var(--accent-soft);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 40px var(--accent-soft);
}
th { 
  background: rgba(0,255,208,0.15); 
  color: var(--accent); 
  padding: 18px 12px; 
  font-weight: 600; 
}
td { 
  padding: 16px 12px; 
  border-top: 1px solid var(--border); 
  color: var(--muted); 
}
tr:hover { background: rgba(0,255,208,0.08); }
.rank { font-weight: 700; color: var(--accent); font-size: 1.3rem; position: relative; }
.id { 
  font-family: monospace; 
  font-weight: 700; 
  color: #ff00aa; 
  letter-spacing: 1px; 
  background: rgba(255,0,170,0.1);
  padding: 4px 10px;
  border-radius: 8px;
}
.points { font-weight: 700; color: #00ff9d; }
tr.top-3 { background: rgba(0,255,208,0.12); }

.empty-state {
  background: rgba(255,255,255,0.03);
  border: 2px dashed var(--accent-soft);
  border-radius: 20px;
  padding: 60px 20px;
  color: var(--muted);
  font-size: 1.3rem;
}

.last-updated { margin-top: 25px; color: var(--muted); font-size: 0.95rem; }
</style>
</head>

<body>

<header>
  <a href="index.html" class="header-logo">MR.SEGREGATOR</a>
</header>

<h1>🏆 SUPER SEGREGATOR LEADERBOARD</h1>

<div class="controls">
  <div class="live-badge">LIVE • refreshes every 30 seconds</div>
  <div id="sound-toggle" class="sound-toggle">🔊 Sound ON</div>
</div>

<p id="loading-text">Loading live leaderboard...</p>

<div id="leaderboard-container">
  <div id="empty-state" class="empty-state" style="display:none;">
    No super segregators yet!<br>
    <small>Be the first one — register and start scoring!</small>
  </div>
  <table id="leaderboard-table" style="display:none;">
    <thead>
      <tr>
        <th>Rank</th>
        <th>ID</th>
        <th>Name</th>
        <th>Points</th>
        <th>Location</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p class="last-updated" id="last-updated"></p>
</div>

<div id="toast">🎉 Rank updated!</div>

<script>
  const SHEET_ID = "1sVhzl9laoE8PKCBeeMBtHBxjn-9M_OFfQMT2jxICF-o";

  const loadingText = document.getElementById('loading-text');
  const container = document.getElementById('leaderboard-container');
  const tbody = document.querySelector('#leaderboard-table tbody');
  const emptyState = document.getElementById('empty-state');
  const lastUpdated = document.getElementById('last-updated');
  const soundToggle = document.getElementById('sound-toggle');
  const toast = document.getElementById('toast');

  let soundEnabled = localStorage.getItem('soundEnabled') !== 'false';
  let previousData = [];

  function updateToggleUI() {
    soundToggle.textContent = soundEnabled ? "🔊 Sound ON" : "🔇 Sound OFF";
    soundToggle.style.background = soundEnabled ? "rgba(0,255,208,0.25)" : "rgba(255,255,255,0.1)";
  }
  updateToggleUI();

  soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    localStorage.setItem('soundEnabled', soundEnabled);
    updateToggleUI();
  });

  function playRankChangeSound() {
    if (!soundEnabled) return;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [520, 680, 840, 980];
    notes.forEach((freq, i) => {
      setTimeout(() => {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const gain = ctx.createGain();
        gain.gain.value = 0.25;
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1200;
        osc.connect(filter).connect(gain).connect(ctx.destination);
        osc.start();
        setTimeout(() => {
          gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
          osc.stop(ctx.currentTime + 0.7);
        }, 180);
      }, i * 120);
    });
  }

  function showToast() {
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2200);
  }

  function loadLeaderboard() {
    fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Master`)
      .then(res => res.text())
      .then(csvText => {
        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            let data = results.data.filter(row => row.Name && row.Name.trim() !== '');
            data.sort((a, b) => (parseFloat(b.Total) || 0) - (parseFloat(a.Total) || 0));

            if (data.length === 0) {
              loadingText.style.display = 'none';
              container.style.display = 'block';
              emptyState.style.display = 'block';
              document.getElementById('leaderboard-table').style.display = 'none';
              previousData = [];
              return;
            }

            const currentData = data.map((row, i) => ({
              name: row.Name,
              rank: i + 1,
              points: parseFloat(row.Total) || 0
            }));

            const improvedNames = new Set();
            if (previousData.length > 0) {
              const prevMap = new Map(previousData.map(item => [item.name, item.rank]));
              currentData.forEach(player => {
                const oldRank = prevMap.get(player.name);
                if (oldRank && player.rank < oldRank) improvedNames.add(player.name);
              });
            }

            tbody.innerHTML = data.map((row, i) => {
              const isImproved = improvedNames.has(row.Name);
              const rankClass = (i < 3 ? 'top-3' : '') + (isImproved ? ' rank-up' : '');
              return `
                <tr class="${rankClass}">
                  <td class="rank">#${i+1}</td>
                  <td class="id">${row.ID || '—'}</td>
                  <td><strong>${row.Name || '—'}</strong></td>
                  <td class="points">${row.Total || '—'}</td>
                  <td>${row.City || '—'}</td>
                </tr>
              `;
            }).join('');

            loadingText.style.display = 'none';
            container.style.display = 'block';
            document.getElementById('leaderboard-table').style.display = 'table';
            emptyState.style.display = 'none';
            lastUpdated.textContent = `Last updated: ${new Date().toLocaleString()}`;

            if (improvedNames.size > 0 || currentData.length > previousData.length) {
              playRankChangeSound();
              showToast();
            }

            previousData = currentData;
          }
        });
      })
      .catch(err => console.error("Refresh error:", err));
  }

  loadLeaderboard();
  setInterval(loadLeaderboard, 30000);
</script>

</body>
</html>
