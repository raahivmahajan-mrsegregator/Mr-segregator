<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Super Segregator Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #0b0f1a;
  --bg-mid: #141a2f;
  --accent: #00ffd0;
  --accent-soft: rgba(0,255,208,0.35);
  --border: rgba(255,255,255,0.18);
  --text: #f4f6ff;
  --muted: #aab0d4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(800px 400px at top, #1a2142, transparent),
              linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
  color: var(--text);
  min-height: 100vh;
  text-align: center;
}

header { padding: 20px; border-bottom: 1px solid var(--border); }
.header-logo { font-size: 1.4rem; color: var(--accent); text-decoration: none; }

h1 {
  font-size: 2.8rem;
  font-weight: 700;
  background: linear-gradient(90deg, #00ffd0, #6ddcff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 30px 0 10px;
}

#loading-text {
  color: var(--accent);
  font-size: 1.2rem;
  margin: 40px 0;
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100% {opacity:0.6;} 50%{opacity:1;} }

#leaderboard-container { 
  max-width: 900px; 
  margin: 40px auto; 
  padding: 0 20px; 
  display:none; 
}

table {
  width: 100%; 
  border-collapse: collapse;
  background: rgba(255,255,255,0.03);
  border: 2px solid var(--accent-soft);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 40px var(--accent-soft);
}
th { 
  background: rgba(0,255,208,0.15); 
  color: var(--accent); 
  padding: 18px 12px; 
  font-weight: 600; 
}
td { 
  padding: 16px 12px; 
  border-top: 1px solid var(--border); 
  color: var(--muted); 
}
tr:hover { background: rgba(0,255,208,0.08); }
.rank { font-weight: 700; color: var(--accent); font-size: 1.3rem; }
.points { font-weight: 700; color: #00ff9d; }

.last-updated { margin-top: 25px; color: var(--muted); font-size: 0.95rem; }
</style>
</head>

<body>

<header>
  <a href="index.html" class="header-logo">MR.SEGREGATOR</a>
</header>

<h1>🏆 SUPER SEGREGATOR LEADERBOARD</h1>
<p id="loading-text">Loading live leaderboard...</p>

<div id="leaderboard-container">
  <table id="leaderboard-table">
    <thead>
      <tr><th>Rank</th><th>Name</th><th>Points</th><th>Location</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <p class="last-updated" id="last-updated"></p>
</div>

<script>
  const SHEET_ID = "1sVhzl9laoE8PKCBeeMBtHBxjn-9M_OFfQMT2jxICF-o";   // ←←← PUT YOUR FULL GOOGLE SHEET ID HERE

  const loadingText = document.getElementById('loading-text');
  const container = document.getElementById('leaderboard-container');
  const tbody = document.querySelector('#leaderboard-table tbody');
  const lastUpdated = document.getElementById('last-updated');

  fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`)
    .then(res => res.text())
    .then(csvText => {
      console.log("✅ Raw CSV received");

      const rows = csvText.trim().split('\n')
        .map(row => row.split(',').map(cell => cell.replace(/^"|"$/g, '').trim()));

      const headers = rows[0].map(h => h.toLowerCase());
      const dataRows = rows.slice(1);

      // Smart column detection (now includes your "Total" column!)
      const nameIndex     = headers.findIndex(h => h.includes('name') || h.includes('full name'));
      const pointsIndex   = headers.findIndex(h => 
        h.includes('point') || 
        h.includes('score') || 
        h.includes('total')
      );
      const locationIndex = headers.findIndex(h => h.includes('city') || h.includes('location'));

      console.log(`Detected → Name:${nameIndex}, Points:${pointsIndex}, Location:${locationIndex}`);

      // Sort by Total points (highest first)
      dataRows.sort((a, b) => {
        const pa = parseFloat(a[pointsIndex]) || 0;
        const pb = parseFloat(b[pointsIndex]) || 0;
        return pb - pa;
      });

      // Build beautiful table
      tbody.innerHTML = dataRows.map((row, i) => `
        <tr>
          <td class="rank">#${i+1}</td>
          <td><strong>${row[nameIndex] || '—'}</strong></td>
          <td class="points">${row[pointsIndex] || '—'}</td>
          <td>${row[locationIndex] || '—'}</td>
        </tr>
      `).join('');

      loadingText.style.display = 'none';
      container.style.display = 'block';
      lastUpdated.textContent = `Last updated: ${new Date().toLocaleString()}`;

      console.log("🎉 Table rendered with", dataRows.length, "participants");
    })
    .catch(err => {
      console.error("Error:", err);
      loadingText.textContent = "⚠️ Failed to load data. Check console.";
    });
</script>

</body>
</html>
