<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Super Segregator Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
:root {
  --bg-dark: #0b0f1a;
  --bg-mid: #141a2f;
  --accent: #00ffd0;
  --accent-soft: rgba(0,255,208,0.35);
  --border: rgba(255,255,255,0.18);
  --text: #f4f6ff;
  --muted: #aab0d4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(800px 400px at top, #1a2142, transparent),
              linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
  color: var(--text);
  min-height: 100vh;
  text-align: center;
}

header { padding: 20px; border-bottom: 1px solid var(--border); }
.header-logo { font-size: 1.4rem; color: var(--accent); text-decoration: none; }

h1 {
  font-size: 2.8rem;
  font-weight: 700;
  background: linear-gradient(90deg, #00ffd0, #6ddcff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 30px 0 10px;
}

#loading-text {
  color: var(--accent);
  font-size: 1.2rem;
  margin: 40px 0;
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100% {opacity:0.6;} 50%{opacity:1;} }

#leaderboard-container { 
  max-width: 980px; 
  margin: 40px auto; 
  padding: 0 20px; 
  display:none; 
}

table {
  width: 100%; 
  border-collapse: collapse;
  background: rgba(255,255,255,0.03);
  border: 2px solid var(--accent-soft);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 40px var(--accent-soft);
}
th { 
  background: rgba(0,255,208,0.15); 
  color: var(--accent); 
  padding: 18px 12px; 
  font-weight: 600; 
}
td { 
  padding: 16px 12px; 
  border-top: 1px solid var(--border); 
  color: var(--muted); 
}
tr:hover { background: rgba(0,255,208,0.08); }
.rank { font-weight: 700; color: var(--accent); font-size: 1.3rem; }
.id { 
  font-family: monospace; 
  font-weight: 700; 
  color: #ff00aa; 
  letter-spacing: 1px; 
  background: rgba(255,0,170,0.1);
  padding: 4px 10px;
  border-radius: 8px;
}
.points { font-weight: 700; color: #00ff9d; }
tr.top-3 { background: rgba(0,255,208,0.12); }

.empty-state {
  background: rgba(255,255,255,0.03);
  border: 2px dashed var(--accent-soft);
  border-radius: 20px;
  padding: 60px 20px;
  color: var(--muted);
  font-size: 1.3rem;
}

.last-updated { margin-top: 25px; color: var(--muted); font-size: 0.95rem; }
</style>
</head>

<body>

<header>
  <a href="index.html" class="header-logo">MR.SEGREGATOR</a>
</header>

<h1>🏆 SUPER SEGREGATOR LEADERBOARD</h1>
<p id="loading-text">Loading live leaderboard...</p>

<div id="leaderboard-container">
  <div id="empty-state" class="empty-state" style="display:none;">
    No super segregators yet!<br>
    <small>Be the first one — register and start scoring!</small>
  </div>
  <table id="leaderboard-table" style="display:none;">
    <thead>
      <tr>
        <th>Rank</th>
        <th>ID</th>
        <th>Name</th>
        <th>Points</th>
        <th>Location</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p class="last-updated" id="last-updated"></p>
</div>

<script>
  const SHEET_ID = "1sVhzl9laoE8PKCBeeMBtHBxjn-9M_OFfQMT2jxICF-o";   // ← YOUR FULL SHEET ID HERE

  const loadingText = document.getElementById('loading-text');
  const container = document.getElementById('leaderboard-container');
  const tbody = document.querySelector('#leaderboard-table tbody');
  const emptyState = document.getElementById('empty-state');
  const lastUpdated = document.getElementById('last-updated');

  fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`)
    .then(res => res.text())
    .then(csvText => {
      Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const data = results.data.filter(row => row.Name && row.Name.trim() !== '');

          // Sort by Total
          data.sort((a, b) => (parseFloat(b.Total) || 0) - (parseFloat(a.Total) || 0));

          if (data.length === 0) {
            loadingText.style.display = 'none';
            container.style.display = 'block';
            emptyState.style.display = 'block';
            return;
          }

          tbody.innerHTML = data.map((row, i) => {
            const rankClass = i < 3 ? 'top-3' : '';
            return `
              <tr class="${rankClass}">
                <td class="rank">#${i+1}</td>
                <td class="id">${row.ID || row['SEG-001'] || '—'}</td>
                <td><strong>${row.Name || '—'}</strong></td>
                <td class="points">${row.Total || '—'}</td>
                <td>${row.City || '—'}</td>
              </tr>
            `;
          }).join('');

          loadingText.style.display = 'none';
          container.style.display = 'block';
          document.getElementById('leaderboard-table').style.display = 'table';
          lastUpdated.textContent = `Last updated: ${new Date().toLocaleString()}`;
        }
      });
    })
    .catch(err => {
      console.error(err);
      loadingText.textContent = "⚠️ Check console";
    });
</script>

</body>
</html>
