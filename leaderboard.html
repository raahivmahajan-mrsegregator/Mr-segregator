<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Segregator — Leaderboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark:#0b0f1a; --bg-mid:#141a2f; --accent:#00ffd0; }
    body { font-family:'Poppins',sans-serif; background:linear-gradient(135deg,var(--bg-dark),var(--bg-mid)); color:#fff; margin:0; padding:20px; }
    h1 { text-align:center; color:var(--accent); font-size:2.8rem; }
    table { width:100%; max-width:1000px; margin:30px auto; border-collapse:collapse; background:var(--bg-mid); border-radius:16px; overflow:hidden; }
    th, td { padding:16px; text-align:center; border-bottom:1px solid rgba(255,255,255,0.1); }
    th { background:#00ffd0; color:#0b0f1a; font-weight:700; }
    tr:hover { background:rgba(0,255,208,0.1); }
    .gold { background:gold; color:#000; font-weight:700; }
    .live { text-align:center; margin:20px; color:var(--accent); font-size:1.1rem; }
  </style>
</head>
<body>
  <h1>🏆 SUPER SEGREGATOR LEADERBOARD</h1>
  <div class="live" id="live">Loading live leaderboard...</div>
  <table id="table"></table>

  <script>
    const SHEET_ID = '1sVhzl9laoE8PKCBeeMBtHBxjn-9M_OFfQMT2jxICF-o';   // ← Your Master Sheet ID

    function loadLeaderboard() {
      const proxyUrl = `https://corsproxy.io/?https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

    fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`)
      .then(res => res.text())
      .then(csvText => {
          console.log("✅ Leaderboard data loaded!");
          // Your existing CSV parsing code goes here
          // (example: const rows = csvText.trim().split('\n').map(row => row.split(',')); )
      })
      .catch(err => console.error("Fetch error:", err));

    }

    loadLeaderboard();
    setInterval(loadLeaderboard, 8000);
  </script>
</body>
</html>
