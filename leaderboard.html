<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Super Segregator Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
:root {
  --bg-dark: #0b0f1a;
  --bg-mid: #141a2f;
  --accent: #00ffd0;
  --accent-soft: rgba(0,255,208,0.35);
  --border: rgba(255,255,255,0.18);
  --text: #f4f6ff;
  --muted: #aab0d4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(800px 400px at top, #1a2142, transparent),
              linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
  color: var(--text);
  min-height: 100vh;
  text-align: center;
  font-size: 14px; /* Base for mobile */
}

header { padding: 15px; border-bottom: 1px solid var(--border); }
.header-logo { font-size: 1.2rem; color: var(--accent); text-decoration: none; }

h1 {
  font-size: 1.8rem;
  font-weight: 700;
  background: linear-gradient(90deg, #00ffd0, #6ddcff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 20px 0 10px;
}

/* CONTROLS */
.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}
.live-badge, .sound-toggle, .force-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,255,208,0.15);
  color: var(--accent);
  font-size: 0.85rem;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 50px;
  border: 1px solid var(--accent-soft);
  cursor: pointer;
  transition: all 0.3s;
}
.live-badge::before { content: "●"; color: #00ff9d; animation: live-blink 1.5s infinite; }
.force-btn { background: rgba(255,0,170,0.2); }
@keyframes live-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* RANK ANIMATION */
.rank-up {
  animation: rankPop 2.2s ease-out forwards;
  position: relative;
}
.rank-up::after {
  content: '↑';
  position: absolute;
  left: -20px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.2rem;
  color: #ff00aa;
  text-shadow: 0 0 15px #ff00aa;
}
@keyframes rankPop {
  0%   { box-shadow: 0 0 0 rgba(0,255,208,0); transform: scale(1.04); }
  15%  { box-shadow: 0 0 80px #00ffd0, 0 0 120px #ff00aa; transform: scale(1.08); }
  100% { box-shadow: 0 0 0 rgba(0,255,208,0); transform: scale(1); }
}

#toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,255,208,0.95);
  color: #000;
  font-weight: 700;
  padding: 10px 20px;
  border-radius: 50px;
  box-shadow: 0 0 30px var(--accent);
  display: none;
  z-index: 9999;
}

#loading-text {
  color: var(--accent);
  font-size: 1rem;
  margin: 30px 0;
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100% {opacity:0.6;} 50%{opacity:1;} }

#leaderboard-container { 
  max-width: 100%;
  margin: 15px auto; 
  padding: 0 15px; 
  display: none; 
}

table {
  width: 100%; 
  border-collapse: collapse;
  background: rgba(255,255,255,0.03);
  border: 2px solid var(--accent-soft);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 40px var(--accent-soft);
}
th { 
  background: rgba(0,255,208,0.15); 
  color: var(--accent); 
  padding: 12px 8px; 
  font-weight: 600; 
  font-size: 0.9rem;
}
td { 
  padding: 12px 8px; 
  border-top: 1px solid var(--border); 
  color: var(--muted); 
  font-size: 0.85rem;
  word-wrap: break-word;
}
tr:hover { background: rgba(0,255,208,0.08); }
.rank { font-weight: 700; color: var(--accent); font-size: 1.1rem; }
.id { 
  font-family: monospace; 
  font-weight: 700; 
  color: #ff00aa; 
  letter-spacing: 1px; 
  background: rgba(255,0,170,0.1);
  padding: 4px 8px;
  border-radius: 8px;
}
.points { font-weight: 700; color: #00ff9d; }
tr.top-3 { background: rgba(0,255,208,0.12); }

.empty-state {
  background: rgba(255,255,255,0.03);
  border: 2px dashed var(--accent-soft);
  border-radius: 20px;
  padding: 40px 15px;
  color: var(--muted);
  font-size: 1.1rem;
}

.last-updated { margin-top: 20px; color: var(--muted); font-size: 0.85rem; }

/* Responsive table for mobile */
@media (max-width: 599px) {
  thead {
    display: none;
  }
  tbody tr {
    display: block;
    margin-bottom: 15px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
  }
  td {
    display: block;
    text-align: right;
    border: none;
    position: relative;
    padding-left: 50%;
    padding-bottom: 10px;
    font-size: 0.9rem;
  }
  td:before {
    content: attr(data-label);
    position: absolute;
    left: 10px;
    width: calc(50% - 20px);
    padding-right: 10px;
    font-weight: 600;
    color: var(--accent);
    text-align: left;
  }
  td:last-child {
    padding-bottom: 0;
  }
  tr:hover { background: none; }
  .rank-up::after { left: auto; right: -20px; top: 10%; }
}

/* Media queries for larger screens */
@media (min-width: 600px) {
  body { font-size: 16px; }
  header { padding: 20px; }
  .header-logo { font-size: 1.4rem; }
  h1 { font-size: 2.8rem; margin: 30px 0 10px; }
  .controls { gap: 15px; }
  .live-badge, .sound-toggle, .force-btn { gap: 8px; font-size: 0.95rem; padding: 6px 16px; }
  .rank-up::after { left: -32px; font-size: 1.4rem; }
  #toast { bottom: 30px; padding: 12px 24px; }
  #loading-text { font-size: 1.2rem; margin: 40px 0; }
  #leaderboard-container { max-width: 980px; margin: 20px auto; padding: 0 20px; }
  th { padding: 18px 12px; font-size: 1rem; }
  td { padding: 16px 12px; font-size: 1rem; }
  .rank { font-size: 1.3rem; }
  .id { padding: 4px 10px; }
  .empty-state { padding: 60px 20px; font-size: 1.3rem; }
  .last-updated { margin-top: 25px; font-size: 0.95rem; }
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="header-logo">MR.SEGREGATOR</a>
</header>

<h1>🏆 SUPER SEGREGATOR LEADERBOARD</h1>

<div class="controls">
  <div class="live-badge">LIVE • refreshes every 30 seconds</div>
  <div id="sound-toggle" class="sound-toggle">🔊 Sound ON</div>
</div>

<p id="loading-text">Loading live leaderboard...</p>

<div id="leaderboard-container">
  <div id="empty-state" class="empty-state" style="display:none;">
    No super segregators yet!<br>
    <small>Be the first one — register and start scoring!</small>
  </div>
  <table id="leaderboard-table" style="display:none;">
    <thead>
      <tr>
        <th>Rank</th>
        <th>ID</th>
        <th>Name</th>
        <th>Points</th>
        <th>Location</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p class="last-updated" id="last-updated"></p>
</div>

<div id="toast">🎉 Rank updated!</div>

<script>
  const SHEET_ID = "1sVhzl9laoE8PKCBeeMBtHBxjn-9M_OFfQMT2jxICF-o";

  const loadingText = document.getElementById('loading-text');
  const container = document.getElementById('leaderboard-container');
  const tbody = document.querySelector('#leaderboard-table tbody');
  const emptyState = document.getElementById('empty-state');
  const lastUpdated = document.getElementById('last-updated');
  const soundToggle = document.getElementById('sound-toggle');
  const toast = document.getElementById('toast');

  let soundEnabled = localStorage.getItem('soundEnabled') !== 'false';
  let previousData = [];

  function updateToggleUI() {
    soundToggle.textContent = soundEnabled ? "🔊 Sound ON" : "🔇 Sound OFF";
    soundToggle.style.background = soundEnabled ? "rgba(0,255,208,0.25)" : "rgba(255,255,255,0.1)";
  }
  updateToggleUI();

  soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    localStorage.setItem('soundEnabled', soundEnabled);
    updateToggleUI();
  });

  function playRankChangeSound() {
    if (!soundEnabled) return;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [262, 330, 392, 523]; // Pleasant C major arpeggio
    notes.forEach((freq, i) => {
      setTimeout(() => {
        const osc = ctx.createOscillator();
        osc.type = 'triangle'; // Softer, bell-like tone
        osc.frequency.value = freq;
        const gain = ctx.createGain();
        gain.gain.value = 0.15; // Lower volume for pleasantness
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1200;
        osc.connect(filter).connect(gain).connect(ctx.destination);
        osc.start();
        setTimeout(() => {
          gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
          osc.stop(ctx.currentTime + 0.5);
        }, 200); // Smoother fade out
      }, i * 150); // Slightly slower progression
    });
  }

  function showToast() {
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2200);
  }

  function loadLeaderboard() {
    const cacheBuster = Date.now();   // ← Forces fresh data (old entries disappear instantly)
    fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Master&t=${cacheBuster}`)
      .then(res => res.text())
      .then(csvText => {
        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            let data = results.data.filter(row => row.Name && row.Name.trim() !== '');
            data.sort((a, b) => (parseFloat(b.Total) || 0) - (parseFloat(a.Total) || 0));

            if (data.length === 0) {
              loadingText.style.display = 'none';
              container.style.display = 'block';
              emptyState.style.display = 'block';
              document.getElementById('leaderboard-table').style.display = 'none';
              previousData = [];
              return;
            }

            const currentData = data.map((row, i) => ({
              name: row.Name,
              rank: i + 1,
              points: parseFloat(row.Total) || 0
            }));

            const improvedNames = new Set();
            if (previousData.length > 0) {
              const prevMap = new Map(previousData.map(item => [item.name, item.rank]));
              currentData.forEach(player => {
                const oldRank = prevMap.get(player.name);
                if (oldRank && player.rank < oldRank) improvedNames.add(player.name);
              });
            }

            tbody.innerHTML = data.map((row, i) => {
              const isImproved = improvedNames.has(row.Name);
              const rankClass = (i < 3 ? 'top-3' : '') + (isImproved ? ' rank-up' : '');
              return `
                <tr class="${rankClass}">
                  <td data-label="Rank" class="rank">#${i+1}</td>
                  <td data-label="ID" class="id">${row.ID || '—'}</td>
                  <td data-label="Name"><strong>${row.Name || '—'}</strong></td>
                  <td data-label="Points" class="points">${row.Total || '—'}</td>
                  <td data-label="Location">${row.City || '—'}</td>
                </tr>
              `;
            }).join('');

            loadingText.style.display = 'none';
            container.style.display = 'block';
            document.getElementById('leaderboard-table').style.display = 'table';
            emptyState.style.display = 'none';
            lastUpdated.textContent = `Last updated: ${new Date().toLocaleString()}`;

            if (improvedNames.size > 0 || currentData.length > previousData.length) {
              playRankChangeSound();
              showToast();
            }

            previousData = currentData;
          }
        });
      })
      .catch(err => console.error("Refresh error:", err));
  }

  loadLeaderboard();
  setInterval(loadLeaderboard, 30000);
</script>

</body>
</html>
