<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mr. Segregator — Segregation Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #0b0f1a;
  --bg-mid: #141a2f;
  --accent: #00ffd0;
  --accent-soft: rgba(0,255,208,0.35);
  --border: rgba(255,255,255,0.18);
  --text: #f4f6ff;
  --muted: #aab0d4;
  --success: #00ff9d;
  --warning: #ff4d4d;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(800px 400px at top, #1a2142, transparent),
              linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}

.header-logo {
  font-size: clamp(1rem, 3vw, 1.3rem);
  font-weight: 700;
  color: var(--accent);
  text-decoration: none;
}

.back-btn {
  font-size: 0.85rem;
  color: var(--muted);
  text-decoration: none;
}

/* HERO */
.hero {
  padding: 25px 15px 5px;
  text-align: center;
}

.hero-title {
  font-size: clamp(1.6rem, 6vw, 2.6rem);
  font-weight: 700;
  background: linear-gradient(90deg, #00ffd0, #6ddcff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* QUIZ SECTION */
.quiz-section {
  flex: 1;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 15px;
  text-align: center;
}

/* IMAGE */
.quiz-image {
  width: 85%;
  max-width: 300px;
  margin: 20px auto;
  border-radius: 18px;
  box-shadow: 0 0 20px var(--accent-soft);
  display: block;
}

/* GRID */
.options-grid {
  display: grid;
  gap: 14px;
  margin-top: 20px;
}

/* Mobile */
@media (max-width: 600px) {
  .options-grid {
    grid-template-columns: 1fr;
  }
}

/* Tablet */
@media (min-width: 601px) and (max-width: 1023px) {
  .options-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Desktop */
@media (min-width: 1024px) {
  .options-grid {
    grid-template-columns: repeat(2, 1fr);
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }
}

/* OPTION BUTTONS */
.option-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  font-size: clamp(0.9rem, 3vw, 1.05rem);
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: 0.2s;
  min-height: 55px;
}

.option-btn:hover:not(.disabled) {
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--accent-soft);
}

.option-btn.correct {
  background: rgba(0,255,157,0.2);
  border-color: var(--success);
  color: var(--success);
}

.option-btn.incorrect {
  background: rgba(255,77,77,0.2);
  border-color: var(--warning);
  color: var(--warning);
}

.option-btn.disabled {
  pointer-events: none;
  opacity: 0.6;
}

/* TEXT */
.quiz-feedback {
  margin-top: 15px;
  font-size: clamp(0.9rem, 3vw, 1.05rem);
  min-height: 24px;
}

.quiz-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.95rem;
  margin-bottom: 8px;
}

.quiz-score {
  color: var(--accent);
}

.quiz-timer {
  color: var(--muted);
}

/* CENTERED NEXT BUTTON */
.quiz-next {
  display: none;
  margin: 25px auto 0 auto;
  padding: 12px 26px;
  font-size: 0.95rem;
  font-weight: 600;
  border-radius: 40px;
  border: none;
  background: var(--accent);
  color: #0b0f1a;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="header-logo">MR.SEGREGATOR</a>
  <a href="index.html" class="back-btn">← Back</a>
</header>

<section class="hero">
  <h1 class="hero-title">Segregation Quiz</h1>
</section>

<div class="quiz-section">
  <div class="quiz-topbar">
    <p id="quizScore" class="quiz-score">Score: 0</p>
    <p id="quizTimer" class="quiz-timer">Time: 30s</p>
  </div>
  <img id="quizImage" class="quiz-image" src="" alt="Quiz Item">

  <div class="options-grid">
    <button class="option-btn" data-category="wet">🌱 WET</button>
    <button class="option-btn" data-category="dry">📦 DRY</button>
    <button class="option-btn" data-category="sanitary">🩸 SANITARY</button>
    <button class="option-btn" data-category="special">⚠️ SPECIAL</button>
  </div>

  <p id="quizFeedback" class="quiz-feedback"></p>
</div>

<script>

const questions = [
  { image: "images/food_waste.png", correct: "wet" },
  { image: "images/leftover-roti.png", correct: "wet" },
  { image: "images/leftover-rice.png", correct: "wet" },
  { image: "images/compostable-cup.png", correct: "wet" },
  { image: "images/compostable-bag.png", correct: "wet" },
  { image: "images/compostable-food-packaging.png", correct: "wet" },
  { image: "images/food-soiled-paper.png", correct: "wet" },

  { image: "images/empty-chocolate-paper-box.png", correct: "dry" },
  { image: "images/empty-glass-bottle.png", correct: "dry" },
  { image: "images/empty-plastic-bottle.png", correct: "dry" },
  { image: "images/empty-milk-carton.png", correct: "dry" },
  { image: "images/aluminium-can.png", correct: "dry" },

  { image: "images/diaper.png", correct: "sanitary" },
  { image: "images/bandaid.png", correct: "sanitary" },
  { image: "images/mask.png", correct: "sanitary" },
  { image: "images/cotton-ear-buds.png", correct: "sanitary" },
  { image: "images/incontinence-sheet.png", correct: "sanitary" },

  { image: "images/bulbs.png", correct: "special" },
  { image: "images/battery-cell.png", correct: "special" },
  { image: "images/cleaning-agents.png", correct: "special" },
  { image: "images/paint-cans.png", correct: "special" },
  { image: "images/empty-medicine-pack.png", correct: "special" },
  { image: "images/medicines.png", correct: "special" },
  { image: "images/mercury_-thermometer.png", correct: "special" }
];

let currentIndex = 0;
let score = 0;
let strikes = 0;
const maxStrikes = 3;
const passingScore = 15;   // ??? CHANGE THIS IF YOU WANT
const timePerQuestion = 15;
let timeLeft = timePerQuestion;
let timerId = null;
let isActive = true;

const quizImage = document.getElementById("quizImage");
const buttons = document.querySelectorAll(".option-btn");
const feedback = document.getElementById("quizFeedback");
const scoreDisplay = document.getElementById("quizScore");
const timerDisplay = document.getElementById("quizTimer");

function loadQuestion() {
  if (!isActive) return;
  const current = questions[currentIndex];
  quizImage.src = current.image;

  feedback.textContent = "";

  buttons.forEach(btn => {
    btn.classList.remove("correct", "incorrect", "disabled");
  });

  resetTimer();
  startTimer();
}

function endGame() {
  isActive = false;
  stopTimer();
  buttons.forEach(btn => btn.style.display = "none");
  timerDisplay.style.display = "none";

  if (score >= passingScore) {
    feedback.textContent = "???? You Passed! Great job saving the planet!";
  } else {
    feedback.textContent = "??? You Failed. Try again and beat the garbage mountain!";
  }
}

function resetTimer() {
  timeLeft = timePerQuestion;
  timerDisplay.textContent = `Time: ${timeLeft}s`;
}

function startTimer() {
  stopTimer();
  timerId = setInterval(() => {
    timeLeft--;
    timerDisplay.textContent = `Time: ${timeLeft}s`;
    if (timeLeft <= 0) {
      stopTimer();
      handleTimeout();
    }
  }, 1000);
}

function stopTimer() {
  if (timerId) {
    clearInterval(timerId);
    timerId = null;
  }
}

function handleTimeout() {
  strikes++;
  feedback.textContent = "??? Time???s up!";
  scoreDisplay.textContent = `Score: ${score} | Strikes: ${strikes}/3`;
  buttons.forEach(btn => btn.classList.add("disabled"));

  if (strikes >= maxStrikes) {
    setTimeout(endGame, 800);
    return;
  }
  setTimeout(nextQuestion, 800);
}

function nextQuestion() {
  if (currentIndex === questions.length - 1) {
    endGame();
    return;
  }
  currentIndex++;
  loadQuestion();
}

buttons.forEach(button => {
  button.addEventListener("click", () => {
    if (!isActive) return;
    stopTimer();
    const selected = button.dataset.category;
    const correct = questions[currentIndex].correct;

    buttons.forEach(btn => btn.classList.add("disabled"));

    if (selected === correct) {
      button.classList.add("correct");
      feedback.textContent = "??? Correct!";
      score++;
    } else {
      button.classList.add("incorrect");
      feedback.textContent = "??? Wrong!";
      strikes++;
    }

    scoreDisplay.textContent = `Score: ${score} | Strikes: ${strikes}/3`;

    if (strikes >= maxStrikes) {
      feedback.textContent = "???? 3 Strikes! Game Over!";
      setTimeout(endGame, 1500);
      return;
    }

    setTimeout(nextQuestion, 800);
  });
});

loadQuestion();

</script>

</body>
</html>
