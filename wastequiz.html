<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mr. Segregator — Segregation Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #0b0f1a;
  --bg-mid: #141a2f;
  --accent: #00ffd0;
  --accent-soft: rgba(0,255,208,0.35);
  --border: rgba(255,255,255,0.18);
  --text: #f4f6ff;
  --muted: #aab0d4;
  --success: #00ff9d;
  --warning: #ff4d4d;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(800px 400px at top, #1a2142, transparent),
              linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}

.header-logo {
  font-size: clamp(1rem, 3vw, 1.3rem);
  font-weight: 700;
  color: var(--accent);
  text-decoration: none;
}

.back-btn {
  font-size: 0.85rem;
  color: var(--muted);
  text-decoration: none;
}

/* HERO */
.hero {
  padding: 25px 15px 5px;
  text-align: center;
}

.hero-title {
  font-size: clamp(1.6rem, 6vw, 2.6rem);
  font-weight: 700;
  background: linear-gradient(90deg, #00ffd0, #6ddcff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* QUIZ SECTION */
.quiz-section {
  flex: 1;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 15px;
  text-align: center;
}

/* IMAGE */
.quiz-image {
  width: 85%;
  max-width: 300px;
  margin: 20px auto;
  border-radius: 18px;
  box-shadow: 0 0 20px var(--accent-soft);
  display: block;
}

/* GRID */
.options-grid {
  display: grid;
  gap: 14px;
  margin-top: 20px;
}

/* Mobile */
@media (max-width: 600px) {
  .options-grid {
    grid-template-columns: 1fr;
  }
}

/* Tablet */
@media (min-width: 601px) and (max-width: 1023px) {
  .options-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Desktop */
@media (min-width: 1024px) {
  .options-grid {
    grid-template-columns: repeat(2, 1fr);
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }
}

/* OPTION BUTTONS */
.option-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  font-size: clamp(0.9rem, 3vw, 1.05rem);
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: 0.2s;
  min-height: 55px;
}

.option-btn:hover:not(.disabled) {
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--accent-soft);
}

.option-btn.correct {
  background: rgba(0,255,157,0.2);
  border-color: var(--success);
  color: var(--success);
}

.option-btn.incorrect {
  background: rgba(255,77,77,0.2);
  border-color: var(--warning);
  color: var(--warning);
}

.option-btn.disabled {
  pointer-events: none;
  opacity: 0.6;
}

/* TEXT */
.quiz-feedback {
  margin-top: 15px;
  font-size: clamp(0.9rem, 3vw, 1.05rem);
  min-height: 24px;
}

.quiz-score {
  margin-top: 8px;
  font-size: 1rem;
  color: var(--accent);
}

/* CENTERED NEXT BUTTON */
.quiz-next {
  display: none;
  margin: 25px auto 0 auto;
  padding: 12px 26px;
  font-size: 0.95rem;
  font-weight: 600;
  border-radius: 40px;
  border: none;
  background: var(--accent);
  color: #0b0f1a;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="header-logo">MR.SEGREGATOR</a>
  <a href="index.html" class="back-btn">← Back</a>
</header>

<section class="hero">
  <h1 class="hero-title">Segregation Quiz</h1>
</section>

<div class="quiz-section">
  <img id="quizImage" class="quiz-image" src="" alt="Quiz Item">

  <div class="options-grid">
    <button class="option-btn" data-category="wet">🌱 WET</button>
    <button class="option-btn" data-category="dry">📦 DRY</button>
    <button class="option-btn" data-category="sanitary">🩸 SANITARY</button>
    <button class="option-btn" data-category="special">⚠️ SPECIAL</button>
  </div>

  <p id="quizFeedback" class="quiz-feedback"></p>
  <p id="quizScore" class="quiz-score">Score: 0</p>
  <button id="nextBtn" class="quiz-next">Next Question</button>
</div>

<script>

const questions = [
  { image: "banana.png", correct: "wet" },
  { image: "apple-core.png", correct: "wet" },
  { image: "vegetable-peels.png", correct: "wet" },
  { image: "leftover-food.png", correct: "wet" },
  { image: "tea-bag.png", correct: "wet" },
  { image: "eggshell.png", correct: "wet" },

  { image: "images/plastic-bottle.png", correct: "dry" },
  { image: "images/newspaper.png", correct: "dry" },
  { image: "images/cardboard-box.png", correct: "dry" },
  { image: "images/chips-packet.png", correct: "dry" },
  { image: "images/glass-bottle.png", correct: "dry" },
  { image: "images/aluminum-can.png", correct: "dry" },

  { image: "images/diaper.png", correct: "sanitary" },
  { image: "images/sanitary-pad.png", correct: "sanitary" },
  { image: "images/tissue-paper.png", correct: "sanitary" },
  { image: "images/bandage.png", correct: "sanitary" },

  { image: "images/battery.png", correct: "special" },
  { image: "images/medicine-strip.png", correct: "special" },
  { image: "images/light-bulb.png", correct: "special" },
  { image: "images/paint-can.png", correct: "special" },
  { image: "images/thermometer.png", correct: "special" }
];

let currentIndex = 0;
let score = 0;
let strikes = 0;
const maxStrikes = 3;
const passingScore = 15;   // ⭐ CHANGE THIS IF YOU WANT

const quizImage = document.getElementById("quizImage");
const buttons = document.querySelectorAll(".option-btn");
const feedback = document.getElementById("quizFeedback");
const scoreDisplay = document.getElementById("quizScore");
const nextBtn = document.getElementById("nextBtn");

function loadQuestion() {
  const current = questions[currentIndex];
  quizImage.src = current.image;

  feedback.textContent = "";
  nextBtn.style.display = "none";

  buttons.forEach(btn => {
    btn.classList.remove("correct", "incorrect", "disabled");
  });
}

function endGame() {
  buttons.forEach(btn => btn.style.display = "none");
  nextBtn.style.display = "none";

  if (score >= passingScore) {
    feedback.textContent = "🎉 You Passed! Great job saving the planet!";
  } else {
    feedback.textContent = "❌ You Failed. Try again and beat the garbage mountain!";
  }
}

buttons.forEach(button => {
  button.addEventListener("click", () => {
    const selected = button.dataset.category;
    const correct = questions[currentIndex].correct;

    buttons.forEach(btn => btn.classList.add("disabled"));

    if (selected === correct) {
      button.classList.add("correct");
      feedback.textContent = "✅ Correct!";
      score++;
    } else {
      button.classList.add("incorrect");
      feedback.textContent = "❌ Wrong!";
      strikes++;
    }

    scoreDisplay.textContent = `Score: ${score} | Strikes: ${strikes}/3`;

    if (strikes >= maxStrikes) {
      feedback.textContent = "💀 3 Strikes! Game Over!";
      setTimeout(endGame, 1500);
      return;
    }

    if (currentIndex === questions.length - 1) {
      setTimeout(endGame, 1500);
    } else {
      nextBtn.style.display = "block";
    }
  });
});

nextBtn.addEventListener("click", () => {
  currentIndex++;
  loadQuestion();
});

loadQuestion();

</script>

</body>
</html>
