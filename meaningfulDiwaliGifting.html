<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17101d" />
  <title>Meaningful Diwali Gifting — Mr. Segregator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --text: #fff8ee; --muted: #d4c4b5; --accent: #ffb347; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: 'Poppins', system-ui, sans-serif; color: var(--text);
      background: radial-gradient(700px 420px at 50% 0, rgba(200, 91, 37, .28), transparent), linear-gradient(145deg, #17101d, #25161b);
    }
    header { padding: 18px clamp(18px, 5vw, 64px); border-bottom: 1px solid rgba(255,255,255,.12); }
    header a { color: var(--accent); text-decoration: none; font-weight: 700; letter-spacing: .04em; }
    main { width: min(100% - 32px, 960px); margin: 0 auto; padding: clamp(42px, 9vw, 92px) 0 64px; }
    .intro { text-align: center; margin-bottom: 34px; }
    .eyebrow { color: var(--accent); font-size: .82rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 10px 0 12px; font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1.12; }
    .intro p { max-width: 620px; margin: 0 auto; color: var(--muted); line-height: 1.7; }
    .video-frame { overflow: hidden; border: 1px solid rgba(255,255,255,.16); border-radius: 20px; background: #09070a; box-shadow: 0 24px 70px rgba(0,0,0,.38); }
    video { display: block; width: 100%; max-height: 76vh; background: #09070a; }
    .caption { margin: 14px 4px 0; color: var(--muted); font-size: .88rem; text-align: center; }
    footer { padding: 20px; color: #a99a8d; text-align: center; font-size: .85rem; }
  </style>
</head>
<body>
  <header><a href="index.html">← Mr. Segregator</a></header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div class="eyebrow">Celebrate with care</div>
      <h1 id="page-title">Meaningful Diwali Gifting</h1>
      <p>A little inspiration for choosing thoughtful gifts and celebrating Diwali with less waste.</p>
    </section>
    <div class="video-frame">
      <video controls playsinline preload="metadata" aria-label="Meaningful Diwali gifting video">
        <source src="videos/meaningful-diwali-gifting.mp4" type="video/mp4">
        Your browser does not support MP4 video playback. <a href="videos/meaningful-diwali-gifting.mp4">Open the video</a>.
      </video>
    </div>
    <p class="caption">Meaningful Diwali Gifting</p>
  </main>
  <footer>Mr. Segregator © 2026</footer>
</body>
</html>
