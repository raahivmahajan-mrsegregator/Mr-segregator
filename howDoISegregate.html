<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mr. Segregator — How Do I Segregate?</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #0b0f1a;
  --bg-mid: #141a2f;
  --accent: #00ffd0;
  --accent-soft: rgba(0,255,208,0.35);
  --border: rgba(255,255,255,0.18);
  --text: #f4f6ff;
  --muted: #aab0d4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', system-ui, sans-serif;
  background: radial-gradient(800px 400px at top, #1a2142, transparent),
              linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
  color: var(--text);
  min-height: 100vh;
  overflow: hidden;
}

/* HEADER */
header {
  padding: 14px 18px;
  font-weight: 700;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.header-logo { font-size: 1.3rem; color: var(--accent); text-decoration: none; }
.back-btn { font-size: 0.95rem; color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 6px; }
.back-btn:hover { color: var(--accent); }

/* CAROUSEL CONTAINER */
.carousel-container {
  position: relative;
  height: calc(100vh - 68px);
  overflow: hidden;
}

.carousel-wrapper {
  display: flex;
  width: 400%;
  height: 100%;
  transition: transform 0.6s cubic-bezier(0.32, 0.72, 0, 1);
}

.carousel-slide {
  width: 25%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.carousel-slide img {
  max-height: 76vh;           /* ← reduced from 92vh */
  max-width: 94%;
  object-fit: contain;
  box-shadow: 0 10px 40px rgba(0, 255, 208, 0.22);
  border-radius: 16px;
}

/* Arrows */
.carousel-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,255,208,0.15);
  color: var(--accent);
  border: none;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  font-size: 2.4rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 100;
  box-shadow: 0 0 20px rgba(0,255,208,0.3);
  transition: all 0.3s;
}

.carousel-arrow:hover {
  background: var(--accent);
  color: #000;
  transform: translateY(-50%) scale(1.15);
}

.carousel-arrow.left { left: 20px; }
.carousel-arrow.right { right: 20px; }

/* FOOTER */
footer {
  padding: 16px;
  text-align: center;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.85rem;
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="header-logo">MR.SEGREGATOR</a>
  <a href="index.html" class="back-btn">← Back to Home</a>
</header>

<div class="carousel-container">
  <div class="carousel-wrapper" id="carouselWrapper">

    <!-- Wet Waste Guide -->
    <div class="carousel-slide">
      <img src="images/guide/WetWasteGuide.png" alt="Wet Waste Guide">
    </div>

    <!-- Dry Waste Guide -->
    <div class="carousel-slide">
      <img src="images/guide/DryWasteGuide.png" alt="Dry Waste Guide">
    </div>

    <!-- Sanitary Waste Guide -->
    <div class="carousel-slide">
      <img src="images/guide/SanitaryWasteGuide.png" alt="Sanitary Waste Guide">
    </div>

    <!-- Special Care Waste Guide -->
    <div class="carousel-slide">
      <img src="images/guide/SpecialCareWasteGuide.png" alt="Special Care Waste Guide">
    </div>

  </div>

  <!-- Arrows -->
  <button class="carousel-arrow left" id="prevBtn">‹</button>
  <button class="carousel-arrow right" id="nextBtn">›</button>
</div>

<footer>
  <p>Mr. Segregator © 2026 • Swipe or use arrows to explore guides</p>
</footer>

<script>
const wrapper = document.getElementById('carouselWrapper');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let current = 0;
const totalSlides = 4;

function updateCarousel() {
  wrapper.style.transform = `translateX(-${current * 25}%)`;
}

prevBtn.addEventListener('click', () => {
  current = (current - 1 + totalSlides) % totalSlides;
  updateCarousel();
});

nextBtn.addEventListener('click', () => {
  current = (current + 1) % totalSlides;
  updateCarousel();
});

// Touch swipe support
let touchStartX = 0;
wrapper.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
wrapper.addEventListener('touchend', e => {
  const touchEndX = e.changedTouches[0].screenX;
  if (touchStartX - touchEndX > 60) {
    current = (current + 1) % totalSlides;
  } else if (touchEndX - touchStartX > 60) {
    current = (current - 1 + totalSlides) % totalSlides;
  }
  updateCarousel();
});
</script>

</body>
</html>
