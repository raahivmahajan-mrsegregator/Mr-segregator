<style>
:root {
  --bg-dark: #0b0f1a;
  --bg-mid: #141a2f;
  --accent: #00ffd0;
  --accent-soft: rgba(0,255,208,0.35);
  --border: rgba(255,255,255,0.18);
  --text: #f4f6ff;
  --muted: #aab0d4;
  --success: #00ff9d;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', system-ui, sans-serif;
  background: radial-gradient(800px 400px at top, #1a2142, transparent),
              linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* HEADER */
header {
  padding: 14px 18px;
  font-weight: 700;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.header-logo {
  font-size: 1.3rem;
  color: var(--accent);
  text-decoration: none;
}

.back-btn {
  font-size: 0.95rem;
  color: var(--muted);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color 0.3s;
}

.back-btn:hover {
  color: var(--accent);
}

/* HERO */
.hero {
  padding: 28px 16px 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  top: -100px;
  left: 50%;
  transform: translateX(-50%);
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
  border-radius: 50%;
  opacity: 0.6;
  z-index: 0;
}

.hero-title {
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 2px;
  background: linear-gradient(90deg, #00ffd0, #6ddcff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-subtitle {
  font-size: 1.05rem;
  color: var(--muted);
  max-width: 520px;
  margin: 0 auto 24px;
}

/* A-Z TILES SECTION */
.tiles-section {
  padding: 0 16px 80px;
  max-width: 800px;
  margin: 0 auto;
}

.tiles-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 16px;
}

.tile {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--accent);
  text-decoration: none;
  transition: all 0.3s ease;
  box-shadow: 0 0 15px rgba(0,255,208,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
}

.tile:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  transform: translateY(-6px);
  box-shadow: 0 0 35px rgba(0,255,208,0.6);
  color: #0b0f1a;
}

/* FOOTER */
footer {
  padding: 40px 16px;
  text-align: center;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.85rem;
}

.footer-links {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.footer-links a {
  color: var(--muted);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.3s;
}

.footer-links a:hover {
  color: var(--accent);
}

/* RESPONSIVE */
@media (min-width: 768px) {
  .hero { padding: 40px 16px 30px; }
  .hero-title { font-size: 2.8rem; }
  .tiles-section { padding: 0 24px 100px; }
  .tiles-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 20px; }
  .tile { font-size: 2.6rem; padding: 30px; }
}
</style>
</head>
