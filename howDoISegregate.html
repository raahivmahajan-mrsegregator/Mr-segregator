<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. Segregator — How Do I Segregate?</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0f1a;
      --bg-mid: #141a2f;
      --accent: #00ffd0;
      --accent-soft: rgba(0,255,208,0.35);
      --border: rgba(255,255,255,0.18);
      --text: #f4f6ff;
      --muted: #aab0d4;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
      color: var(--text);
      height: 100dvh;          /* modern dynamic viewport height */
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1.2rem;
      background: var(--bg-mid);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      z-index: 10;
    }

    .header-logo {
      font-size: 1.25rem;
      color: var(--accent);
      text-decoration: none;
    }

    .back-btn {
      font-size: 0.95rem;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .back-btn:hover {
      color: var(--accent);
    }

    /* Main carousel takes remaining space */
    .carousel-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .carousel-wrapper {
      display: flex;
      height: 100%;
      width: 400%;                /* 4 slides × 100% */
      transition: transform 0.5s ease-out;
    }

    .carousel-slide {
      width: 25%;                 /* 100% / 4 */
      height: 100%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: transparent;
    }

    .carousel-slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 255, 208, 0.2);
    }

    /* Arrows - larger touch targets on mobile */
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 54px;
      height: 54px;
      background: rgba(0,255,208,0.18);
      color: var(--accent);
      border: none;
      border-radius: 50%;
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: all 0.25s;
      backdrop-filter: blur(4px);
    }

    .carousel-arrow:hover,
    .carousel-arrow:active {
      background: var(--accent);
      color: #000;
      transform: translateY(-50%) scale(1.1);
    }

    .left  { left: 12px; }
    .right { right: 12px; }

    footer {
      padding: 0.8rem;
      text-align: center;
      background: var(--bg-mid);
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
      z-index: 10;
    }

    @media (min-width: 768px) {
      .carousel-arrow { width: 60px; height: 60px; font-size: 2.6rem; }
      .left  { left: 24px; }
      .right { right: 24px; }
      header, footer { padding: 1.2rem 2rem; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="header-logo">MR.SEGREGATOR</a>
    <a href="index.html" class="back-btn">← Back to Home</a>
  </header>

  <div class="carousel-container">
    <div class="carousel-wrapper" id="wrapper">

      <div class="carousel-slide">
        <img src="images/guide/WetWasteGuide.png" alt="Wet Waste Guide">
      </div>

      <div class="carousel-slide">
        <img src="images/guide/DryWasteGuide.png" alt="Dry Waste Guide">
      </div>

      <div class="carousel-slide">
        <img src="images/guide/SanitaryWasteGuide.png" alt="Sanitary Waste Guide">
      </div>

      <div class="carousel-slide">
        <img src="images/guide/SpecialCareWasteGuide.png" alt="Special Care Waste Guide">
      </div>

    </div>

    <button class="carousel-arrow left" id="prev">‹</button>
    <button class="carousel-arrow right" id="next">›</button>
  </div>

  <footer>
    Mr. Segregator © 2026 • Swipe or tap arrows to view guides
  </footer>

  <script>
    const wrapper = document.getElementById('wrapper');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');

    let currentIndex = 0;
    const total = 4;

    function goTo(index) {
      currentIndex = (index + total) % total;
      wrapper.style.transform = `translateX(-${currentIndex * 25}%)`;
    }

    prev.addEventListener('click', () => goTo(currentIndex - 1));
    next.addEventListener('click', () => goTo(currentIndex + 1));

    // Basic swipe support
    let startX = 0;
    let isDragging = false;

    wrapper.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      isDragging = true;
    }, { passive: true });

    wrapper.addEventListener('touchmove', e => {
      if (!isDragging) return;
      e.preventDefault(); // smoother on some browsers
    }, { passive: false });

    wrapper.addEventListener('touchend', e => {
      if (!isDragging) return;
      isDragging = false;

      const endX = e.changedTouches[0].clientX;
      const diff = startX - endX;

      if (Math.abs(diff) > 50) { // threshold ~50px
        if (diff > 0) goTo(currentIndex + 1); // left swipe → next
        else          goTo(currentIndex - 1); // right swipe → prev
      }
    }, { passive: true });
  </script>

</body>
</html>
