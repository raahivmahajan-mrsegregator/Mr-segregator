<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. Segregator — How Do I Segregate?</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0f1a;
      --bg-mid: #141a2f;
      --accent: #00ffd0;
      --accent-soft: rgba(0,255,208,0.35);
      --border: rgba(255,255,255,0.18);
      --text: #f4f6ff;
      --muted: #aab0d4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1.2rem;
      background: var(--bg-mid);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      z-index: 10;
    }

    .header-logo { font-size: 1.25rem; color: var(--accent); text-decoration: none; }
    .back-btn { font-size: 0.95rem; color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 0.4rem; }
    .back-btn:hover { color: var(--accent); }

    .carousel-container { flex: 1; position: relative; overflow: hidden; }

    .carousel-wrapper {
      display: flex;
      height: 100%;
      width: 400%;
      transition: transform 0.5s ease-out;
    }

    .carousel-slide {
      width: 25%;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .carousel-slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 255, 208, 0.2);
    }

    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 54px;
      height: 54px;
      background: rgba(0,255,208,0.18);
      color: var(--accent);
      border: none;
      border-radius: 50%;
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: all 0.25s;
      backdrop-filter: blur(4px);
    }

    .carousel-arrow:hover,
    .carousel-arrow:active {
      background: var(--accent);
      color: #000;
      transform: translateY(-50%) scale(1.1);
    }

    .left  { left: 12px; }
    .right { right: 12px; }

    footer {
      padding: 0.8rem;
      text-align: center;
      background: var(--bg-mid);
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
      z-index: 10;
    }

    /* Feedback Overlay */
    .feedback-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 15, 26, 0.97);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .feedback-content {
      background: var(--bg-mid);
      border: 1px solid var(--accent-soft);
      border-radius: 20px;
      padding: 2.2rem 1.8rem;
      max-width: 420px;
      width: 92%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 255, 208, 0.2);
    }
    .answer-btn {
      padding: 14px 32px;
      margin: 10px 6px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .yes-btn { background: #00ffd0; color: #0b0f1a; }
    .no-btn  { background: #ff3366; color: white; }
    .answer-btn:hover { transform: scale(1.06); }

    @media (min-width: 768px) {
      .carousel-arrow { width: 60px; height: 60px; font-size: 2.6rem; }
      .left  { left: 24px; }
      .right { right: 24px; }
      header, footer { padding: 1.2rem 2rem; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="header-logo">MR.SEGREGATOR</a>
    <a href="index.html" class="back-btn">← Back to Home</a>
  </header>

  <div class="carousel-container">
    <div class="carousel-wrapper" id="wrapper">

      <div class="carousel-slide">
        <img src="images/guide/wet_waste_guide.webp" alt="Wet Waste Guide">
      </div>
      <div class="carousel-slide">
        <img src="images/guide/dry_waste_guide.webp" alt="Dry Waste Guide">
      </div>
      <div class="carousel-slide">
        <img src="images/guide/sanitary_waste_guide.webp" alt="Sanitary Waste Guide">
      </div>
      <div class="carousel-slide">
        <img src="images/guide/special_care_waste_guide.webp" alt="Special Care Waste Guide">
      </div>

    </div>

    <button class="carousel-arrow left" id="prev">‹</button>
    <button class="carousel-arrow right" id="next">›</button>
  </div>

  <footer>
    Mr. Segregator © 2026 • Swipe or tap arrows to view guides
  </footer>

  <!-- FEEDBACK OVERLAY -->
  <div id="feedbackOverlay" class="feedback-overlay">
    <div class="feedback-content">
      <h2 style="color:var(--accent); font-size:1.5rem; margin-bottom:1rem;">Thank You! 🌍</h2>
      <p style="color:var(--muted); margin-bottom:1.6rem; line-height:1.4;">
        You have completed all the guides.<br>
        Please answer two quick questions:
      </p>
      
      <div style="margin-bottom:1.6rem;">
        <p style="margin-bottom:10px; font-weight:500;">1. Did the guide help you segregate better?</p>
        <button onclick="selectAnswer(1, true, this)" class="answer-btn yes-btn">Yes</button>
        <button onclick="selectAnswer(1, false, this)" class="answer-btn no-btn">No</button>
      </div>
      
      <div style="margin-bottom:1.8rem;">
        <p style="margin-bottom:10px; font-weight:500;">2. Will you segregate at home, so no Garbage Mountain gets created?</p>
        <button onclick="selectAnswer(2, true, this)" class="answer-btn yes-btn">Yes</button>
        <button onclick="selectAnswer(2, false, this)" class="answer-btn no-btn">No</button>
      </div>
      
      <button id="submitBtn" onclick="submitFeedback()" 
              style="background:var(--accent); color:#0b0f1a; padding:15px; border:none; border-radius:50px; font-weight:700; font-size:1.1rem; width:100%;"
              disabled>Submit My Answers</button>
      
      <button onclick="closeOverlay()" style="margin-top:18px; background:none; border:none; color:var(--muted); font-size:0.95rem; cursor:pointer;">
        Skip for now
      </button>
    </div>
  </div>

<script>
    const wrapper = document.getElementById('wrapper');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    let currentIndex = 0;
    const total = 4;

    function updateCarousel() {
      wrapper.style.transform = `translateX(-${currentIndex * 25}%)`;
      if (currentIndex === total - 1) {
        nextBtn.innerHTML = '✓';
        nextBtn.style.fontSize = '1.8rem';
        nextBtn.style.width = '64px';
        nextBtn.style.height = '64px';
      } else {
        nextBtn.innerHTML = '›';
        nextBtn.style.fontSize = '2.2rem';
        nextBtn.style.width = '54px';
        nextBtn.style.height = '54px';
      }
    }

    function goTo(index) {
      currentIndex = (index + total) % total;
      updateCarousel();
    }

    prevBtn.addEventListener('click', () => goTo(currentIndex - 1));
    nextBtn.addEventListener('click', () => {
      if (currentIndex === total - 1) showFeedbackOverlay();
      else goTo(currentIndex + 1);
    });

    // Swipe support (unchanged)
    let startX = 0;
    let isDragging = false;
    wrapper.addEventListener('touchstart', e => { startX = e.touches[0].clientX; isDragging = true; }, { passive: true });
    wrapper.addEventListener('touchend', e => {
      if (!isDragging) return;
      isDragging = false;
      const diff = startX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) {
          if (currentIndex === total - 1) showFeedbackOverlay();
          else goTo(currentIndex + 1);
        } else goTo(currentIndex - 1);
      }
    }, { passive: true });

    // ================== GOOGLE FORMS FEEDBACK (no login needed) ==================
    let userAnswers = {};
    let hasShownFeedback = false;

    function selectAnswer(question, value, btn) {
      userAnswers['q' + question] = value;
      const parentBtns = btn.parentElement.querySelectorAll('.answer-btn');
      parentBtns.forEach(b => b.style.opacity = '0.45');
      btn.style.opacity = '1';
      if (userAnswers.q1 !== undefined && userAnswers.q2 !== undefined) {
        document.getElementById('submitBtn').disabled = false;
      }
    }

    function submitFeedback() {
      const formUrl = 'https://docs.google.com/forms/u/0/d/e/1FAIpQLSfRoTddo30P_jhGKRrT_5naQPruL0fT_WfA5eX-bGwFerMjqw/formResponse'; // ← CHANGE THIS

      const data = new URLSearchParams();
      data.append('entry.290156207', userAnswers.q1 ? 'Yes' : 'No');   // replace with your actual entry ID
      data.append('entry.26353607', userAnswers.q2 ? 'Yes' : 'No');

      fetch(formUrl, {
        method: 'POST',
        body: data,
        mode: 'no-cors'   // this makes it work perfectly on GitHub Pages
      }).then(() => {
        localStorage.setItem('segregatorFeedbackDone', 'true');
        alert('✅ Thank you! Feedback saved.');
        closeOverlay();
      }).catch(() => {
        alert('✅ Thank you! Feedback saved.');
        closeOverlay();
      });
    }

    function closeOverlay() {
      document.getElementById('feedbackOverlay').style.display = 'none';
    }

    function showFeedbackOverlay() {
      if (hasShownFeedback || localStorage.getItem('segregatorFeedbackDone')) return;
      hasShownFeedback = true;
      document.getElementById('feedbackOverlay').style.display = 'flex';
    }

    updateCarousel();
  </script>

</body>
</html>
