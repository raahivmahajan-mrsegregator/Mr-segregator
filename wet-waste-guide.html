<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mr. Segregator — Wet Waste Guide</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #0b0f1a;
  --bg-mid: #141a2f;
  --accent: #00ffd0;
  --accent-soft: rgba(0,255,208,0.35);
  --border: rgba(255,255,255,0.18);
  --text: #f4f6ff;
  --muted: #aab0d4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', system-ui, sans-serif;
  background: radial-gradient(800px 400px at top, #1a2142, transparent),
              linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* HEADER */
header {
  padding: 14px 18px;
  font-weight: 700;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.header-logo {
  font-size: 1.3rem;
  color: var(--accent);
  text-decoration: none;
}

.back-btn {
  font-size: 0.95rem;
  color: var(--muted);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
}

.back-btn:hover { color: var(--accent); }

/* HERO - Minimal */
.hero {
  padding: 30px 16px 20px;
  text-align: center;
}

.hero-title {
  font-size: 2.4rem;
  font-weight: 700;
  background: linear-gradient(90deg, #00ffd0, #6ddcff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}

/* MAIN IMAGE CONTAINER */
.guide-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 16px 80px;
}

.guide-image {
  width: 100%;
  border-radius: 24px;
  border: 2px solid var(--accent-soft);
  box-shadow: 
    0 0 40px var(--accent-soft),
    0 0 80px rgba(0,255,208,0.15);
  display: block;
}

/* FOOTER */
footer {
  padding: 40px 16px;
  text-align: center;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.85rem;
}

.footer-links {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.footer-links a {
  color: var(--muted);
  text-decoration: none;
  font-weight: 500;
}

.footer-links a:hover { color: var(--accent); }
</style>
</head>

<body>

<header>
  <a href="index.html" class="header-logo">MR.SEGREGATOR</a>
  <a href="index.html" class="back-btn">← Back to Home</a>
</header>

<section class="hero">
  <h1 class="hero-title">WET WASTE GUIDE</h1>
</section>

<div class="guide-container">
  <!-- Place your reference image here -->
  <img src="wetWasteGuide.png" 
       class="guide-image" 
       alt="Wet Waste Guide">
</div>

<footer>
  <div class="footer-links">
    <a href="dry.html">Dry Waste</a>
    <a href="sanitary.html">Sanitary</a>
    <a href="special.html">Special</a>
    <a href="resin.html">Resin Codes</a>
  </div>
  <p>Mr. Segregator © 2026 • Segregate Today, Sustain Tomorrow</p>
</footer>

</body>
</html>
