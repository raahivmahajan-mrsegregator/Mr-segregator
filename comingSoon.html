<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mr. Segregator — Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #0b0f1a;
  --bg-mid: #141a2f;
  --accent: #00ffd0;
  --accent-soft: rgba(0,255,208,0.35);
  --border: rgba(255,255,255,0.18);
  --text: #f4f6ff;
  --muted: #aab0d4;
  --success: #00ff9d;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Poppins', system-ui, sans-serif;
  background: radial-gradient(800px 400px at top, #1a2142, transparent),
              linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  line-height: 1.6;
}

/* HEADER */
header {
  padding: 14px 18px;
  font-weight: 700;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.header-logo {
  font-size: 1.3rem;
  color: var(--accent);
  text-decoration: none;
}

.back-btn {
  font-size: 0.95rem;
  color: var(--muted);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color 0.3s;
}

.back-btn:hover {
  color: var(--accent);
}

/* HERO / COMING SOON */
.hero {
  padding: 40px 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero::before {
  content: "";
  position: absolute;
  top: -100px;
  left: 50%;
  transform: translateX(-50%);
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
  border-radius: 50%;
  opacity: 0.6;
  z-index: 0;
}

.coming-soon-container {
  position: relative;
  z-index: 1;
  max-width: 620px;
  text-align: center;
}

.title {
  font-size: clamp(3.2rem, 9vw, 5.5rem);
  font-weight: 700;
  background: linear-gradient(90deg, #00ffd0, #6ddcff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 12px;
  text-shadow: 0 0 30px var(--accent-soft);
}

.subtitle {
  font-size: 1.25rem;
  color: var(--muted);
  line-height: 1.5;
}

/* FOOTER */
footer {
  padding: 40px 16px;
  text-align: center;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.85rem;
}

.footer-links {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.footer-links a {
  color: var(--muted);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.3s;
}

.footer-links a:hover {
  color: var(--accent);
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="header-logo">MR.SEGREGATOR</a>
  <a href="index.html" class="back-btn">⬅️ Back</a>
</header>

<div class="hero">
  <div class="coming-soon-container">
    <h1 class="title">COMING SOON</h1>
    <p class="subtitle">
      Next-level waste segregation experience<br>
      Smarter • Cleaner • Zero Waste
    </p>
  </div>
</div>

<footer>
  <p>Mr. Segregator © 2026 • Segregate Today, Sustain Tomorrow</p>
</footer>

</body>
</html>
