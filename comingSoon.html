<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. Segregator — Coming Soon</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0e18;
      --bg-mid: #111827;
      --border: rgba(0, 240, 255, 0.14);
      --text: #f0f9ff;
      --muted: #a5d8ff;

      /* Main Green (used everywhere consistently) */
      --green-glow: #34f5a3;
      --green-soft: rgba(52, 245, 163, 0.18);

      --lavender-purple: #d8b4fe;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(0,240,255,0.08) 0%, transparent 35%),
        radial-gradient(circle at 85% 75%, rgba(0,240,255,0.06) 0%, transparent 40%),
        linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(17, 24, 39, 0.4);
      backdrop-filter: blur(10px);
    }

    /* MR.SEGREGATOR */
    .header-logo {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-decoration: none;
      color: var(--green-glow);
      text-shadow:
        0 0 14px rgba(52, 245, 163, 0.8),
        0 0 28px rgba(52, 245, 163, 0.6);
      transition: 0.3s ease;
    }

    .header-logo:hover {
      text-shadow:
        0 0 20px rgba(52, 245, 163, 1),
        0 0 40px rgba(52, 245, 163, 0.8);
    }

    .back-link {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--lavender-purple);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 12px;
      transition: 0.3s ease;
    }

    .back-link:hover {
      color: var(--green-glow);
      background: var(--green-soft);
      box-shadow: 0 0 24px rgba(52, 245, 163, 0.5);
      transform: translateY(-1px);
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .coming-soon-container {
      text-align: center;
      max-width: 820px;
      padding: 48px 32px;
      background: rgba(17, 24, 39, 0.25);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow:
        0 0 40px rgba(52, 245, 163, 0.15),
        inset 0 0 20px rgba(52, 245, 163, 0.05);
    }

    /* COMING SOON — same exact green as logo */
    .title {
      font-size: clamp(4rem, 10vw, 8rem);
      font-weight: 900;
      color: var(--green-glow);
      margin-bottom: 24px;
      letter-spacing: -2px;
      text-shadow:
        0 0 20px rgba(52, 245, 163, 0.9),
        0 0 40px rgba(52, 245, 163, 0.7),
        0 0 60px rgba(52, 245, 163, 0.4);
    }

    .subtitle {
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      color: var(--muted);
      margin-bottom: 40px;
      line-height: 1.5;
    }

    footer {
      padding: 32px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="header-logo">MR.SEGREGATOR</a>
    <a href="index.html" class="back-link">← Back to System</a>
  </header>

  <main>
    <div class="coming-soon-container">
      <h1 class="title">COMING SOON</h1>

      <p class="subtitle">
        Next-level waste segregation experience<br>
        Smarter • Cleaner • Zero Waste
      </p>
    </div>
  </main>

  <footer>
    <p>Mr. Segregator © 2026 • Segregate Today, Sustain Tomorrow</p>
  </footer>

</body>
</html>
